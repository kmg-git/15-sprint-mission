name: deploy
#2
on:
  push:
    branches: [ release ]

permissions:
  id-token: write     # OIDC 신분증(토큰) 발급 허용 — 이 줄이 없으면 인증 실패
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: discodeit  # 네이밍컨벤션 8
  ECS_CLUSTER: discodeit-cluster # 네이밍컨벤션 10
  ECS_SERVICE: discodeit-service # 네이밍컨벤션 13
  TASK_FAMILY: discodeit-task  # 네이밍컨벤션 11

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: AWS 인증 (OIDC — 키 없음)
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::279102686634:role/github-actions-discodeit  # 네이밍컨벤션 14
          aws-region: ${{ env.AWS_REGION }}

      - name: Diagnose AWS OIDC trust mismatch
        if: ${{ failure() && steps.aws-auth.outcome == 'failure' }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'sts.amazonaws.com');
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!response.ok) {
            throw new Error(`GitHub OIDC request failed: HTTP ${response.status}`);
          }
          const { value } = await response.json();
          const { sub, aud } = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
          console.log(JSON.stringify({ sub, aud }, null, 2));
          NODE

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드하고 push (태그 = 커밋 해시)
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 현재 태스크 정의 내려받기
        run: |
          aws ecs describe-task-definition --task-definition $TASK_FAMILY \
            --query taskDefinition > task-definition.json

      - name: 태스크 정의에 새 이미지 끼우기
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: discodeit  # 본인 컨테이너 이름
          image: ${{ steps.build-image.outputs.image }}

      - name: ECS에 배포하고 안정화까지 대기
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
